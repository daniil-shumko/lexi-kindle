<!DOCTYPE html>
<!--
A short Lexi message over the Kindle UI that closes itself: the feedback for the library scriptlets,
which have no screen of their own. Shown by `native/ui.lua notice <text>` (from native/lexi.sh).

Params in: { text } | { dismiss: true }
-->
<html>
<head>
<meta charset="utf-8">
<script type="text/javascript" src="bridge.js"></script>
<style>
html, body { margin: 0; padding: 0; background: white; color: black; }
body { font-family: dialog, "Amazon Ember", sans-serif; font-size: 34px; }
#card { box-sizing: border-box; border: 3px solid black; border-radius: 10px; background: white;
        padding: 0.7em 0.9em; text-align: center; }
#title { font-weight: bold; font-size: 1.1em; margin-bottom: 0.3em; }
#text { font-size: 1.05em; }
</style>
<script type="text/javascript">
var SW = (window.screen && screen.width) || 1272;
var S = { shown: false, closed: false, timer: null };

function el(id) { return document.getElementById(id); }

function dismiss() {
    if (S.closed) return;
    S.closed = true;
    clearTimeout(S.timer);
    nativeBridge.dismissMe();
}

function onParams(json) {
    var p = JSON.parse(json);
    if (p.dismiss) return dismiss();
    el("text").textContent = p.text || "";
    var w = Math.round(SW * 0.8);
    el("card").style.width = w + "px";
    nativeBridge.setWindowSize(w, el("card").offsetHeight);
    if (!S.shown) {
        S.shown = true;
        nativeBridge.showMe();
    } else {
        nativeBridge.redraw();
    }
    clearTimeout(S.timer);
    S.timer = setTimeout(dismiss, 4000);
}

function init() {
    nativeBridge.registerClientParamsCallback(onParams);
}
</script>
</head>
<body onload="init();">
<div id="card" onclick="dismiss();">
    <div id="title">Lexi</div>
    <div id="text"></div>
</div>
</body>
</html>
